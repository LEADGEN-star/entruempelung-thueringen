<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<defs>
  <linearGradient id="n2-ceil" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f0ebe4"/><stop offset="100%" stop-color="#e6e1da"/>
  </linearGradient>
  <linearGradient id="n2-back" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#e8e3dc"/><stop offset="100%" stop-color="#dbd6cf"/>
  </linearGradient>
  <linearGradient id="n2-lwall" x1="100%" y1="0%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#dedad3"/><stop offset="100%" stop-color="#d2cdc6"/>
  </linearGradient>
  <linearGradient id="n2-rwall" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#d6d1ca"/><stop offset="100%" stop-color="#cac6be"/>
  </linearGradient>
  <linearGradient id="n2-floor" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#b8a070"/><stop offset="100%" stop-color="#d0b888"/>
  </linearGradient>
  <linearGradient id="n2-sky" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#78b8e8"/><stop offset="100%" stop-color="#bcdcf4"/>
  </linearGradient>
  <radialGradient id="n2-sun" cx="50%" cy="0%" r="80%">
    <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.55"/><stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <radialGradient id="n2-vig" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/><stop offset="100%" stop-color="#000" stop-opacity="0.20"/>
  </radialGradient>
</defs>
<rect width="900" height="500" fill="#eee9e1"/>
<polygon points="0,0 900,0 720,85 180,85" fill="url(#n2-ceil)"/>
<polygon points="180,85 720,85 720,285 180,285" fill="url(#n2-back)"/>
<polygon points="0,0 180,85 180,285 0,500" fill="url(#n2-lwall)"/>
<polygon points="900,0 720,85 720,285 900,500" fill="url(#n2-rwall)"/>
<polygon points="0,500 900,500 720,285 180,285" fill="url(#n2-floor)"/>
<!-- floor planks -->
<line x1="450" y1="285" x2="0" y2="500" stroke="#a88858" stroke-width="1.5" opacity="0.38"/>
<line x1="450" y1="285" x2="150" y2="500" stroke="#a88858" stroke-width="1" opacity="0.28"/>
<line x1="450" y1="285" x2="300" y2="500" stroke="#a88858" stroke-width="1" opacity="0.28"/>
<line x1="450" y1="285" x2="450" y2="500" stroke="#a88858" stroke-width="1" opacity="0.22"/>
<line x1="450" y1="285" x2="600" y2="500" stroke="#a88858" stroke-width="1" opacity="0.28"/>
<line x1="450" y1="285" x2="750" y2="500" stroke="#a88858" stroke-width="1" opacity="0.28"/>
<line x1="450" y1="285" x2="900" y2="500" stroke="#a88858" stroke-width="1.5" opacity="0.38"/>
<line x1="190" y1="330" x2="710" y2="330" stroke="#a88858" stroke-width="1" opacity="0.20"/>
<line x1="185" y1="378" x2="715" y2="378" stroke="#a88858" stroke-width="1" opacity="0.16"/>
<line x1="180" y1="432" x2="720" y2="432" stroke="#a88858" stroke-width="1" opacity="0.13"/>
<!-- window -->
<rect x="335" y="108" width="230" height="152" fill="url(#n2-sky)"/>
<rect x="335" y="108" width="230" height="152" fill="url(#n2-sun)"/>
<rect x="335" y="108" width="230" height="152" fill="none" stroke="#d0cbc4" stroke-width="8"/>
<line x1="450" y1="108" x2="450" y2="260" stroke="#d0cbc4" stroke-width="6"/>
<line x1="335" y1="184" x2="565" y2="184" stroke="#d0cbc4" stroke-width="6"/>
<!-- sunlight on floor -->
<polygon points="320,260 580,260 810,500 90,500" fill="#fff5d8" opacity="0.20"/>
<ellipse cx="450" cy="425" rx="220" ry="54" fill="#fff5d8" opacity="0.25"/>
<!-- skirting -->
<polygon points="180,282 720,282 720,290 180,290" fill="#cac5be" opacity="0.7"/>
<polygon points="0,497 180,285 180,290 0,500" fill="#c6c1ba" opacity="0.7"/>
<polygon points="900,497 720,285 720,290 900,500" fill="#c2bdb6" opacity="0.7"/>
<rect width="900" height="500" fill="#fff" opacity="0.05"/>
<rect width="900" height="500" fill="url(#n2-vig)"/>
<rect x="0" y="448" width="900" height="52" fill="#000" opacity="0.48"/>
<text x="22" y="483" font-family="Arial Black,Arial" font-weight="900" font-size="21" fill="#fff" letter-spacing="1">Nach der Entrümpelung – besenrein</text>
</svg>
