[build]
  publish = "."

# Force HTTP → HTTPS redirect
[[redirects]]
  from = "http://entruempelung-thueringen.com/*"
  to = "https://entruempelung-thueringen.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.entruempelung-thueringen.com/*"
  to = "https://entruempelung-thueringen.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.entruempelung-thueringen.com/*"
  to = "https://entruempelung-thueringen.com/:splat"
  status = 301
  force = true

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
