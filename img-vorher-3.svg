<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<defs>
  <linearGradient id="v3-ceil" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#c4bcb0"/><stop offset="100%" stop-color="#b4aca0"/>
  </linearGradient>
  <linearGradient id="v3-back" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#aca498"/><stop offset="100%" stop-color="#9c9488"/>
  </linearGradient>
  <linearGradient id="v3-floor" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#786858"/><stop offset="100%" stop-color="#584840"/>
  </linearGradient>
  <radialGradient id="v3-win" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#3a4858" stop-opacity="0.8"/><stop offset="100%" stop-color="#1a2030"/>
  </radialGradient>
  <radialGradient id="v3-vig" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/><stop offset="100%" stop-color="#000" stop-opacity="0.60"/>
  </radialGradient>
</defs>
