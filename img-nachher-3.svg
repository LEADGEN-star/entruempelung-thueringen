<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<defs>
  <linearGradient id="n3-ceil" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#f4efe8"/><stop offset="100%" stop-color="#eae5de"/>
  </linearGradient>
  <linearGradient id="n3-back" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ece7e0"/><stop offset="100%" stop-color="#dedad3"/>
  </linearGradient>
  <linearGradient id="n3-lwall" x1="100%" y1="0%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#e2ddd6"/><stop offset="100%" stop-color="#d6d1ca"/>
  </linearGradient>
  <linearGradient id="n3-rwall" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#dad5ce"/><stop offset="100%" stop-color="#cecac2"/>
  </linearGradient>
  <linearGradient id="n3-floor" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#bea87a"/><stop offset="100%" stop-color="#d6c090"/>
  </linearGradient>
  <linearGradient id="n3-sky" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#70b4e4"/><stop offset="100%" stop-color="#b8d8f2"/>
  </linearGradient>
  <radialGradient id="n3-sun" cx="50%" cy="0%" r="80%">
    <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.58"/><stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <radialGradient id="n3-vig" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/><stop offset="100%" stop-color="#000" stop-opacity="0.22"/>
  </radialGradient>
</defs>
<rect width="900" height="500" fill="#f0ece4"/>
<polygon points="0,0 900,0 720,85 180,85" fill="url(#n3-ceil)"/>
<polygon points="180,85 720,85 720,285 180,285" fill="url(#n3-back)"/>
<polygon points="0,0 180,85 180,285 0,500" fill="url(#n3-lwall)"/>
<polygon points="900,0 720,85 720,285 900,500" fill="url(#n3-rwall)"/>
<polygon points="0,500 900,500 720,285 180,285" fill="url(#n3-floor)"/>
<!-- floor planks -->
<line x1="450" y1="285" x2="0" y2="500" stroke="#b09060" stroke-width="1.5" opacity="0.40"/>
<line x1="450" y1="285" x2="150" y2="500" stroke="#b09060" stroke-width="1" opacity="0.30"/>
<line x1="450" y1="285" x2="300" y2="500" stroke="#b09060" stroke-width="1" opacity="0.30"/>
<line x1="450" y1="285" x2="450" y2="500" stroke="#b09060" stroke-width="1" opacity="0.25"/>
<line x1="450" y1="285" x2="600" y2="500" stroke="#b09060" stroke-width="1" opacity="0.30"/>
<line x1="450" y1="285" x2="750" y2="500" stroke="#b09060" stroke-width="1" opacity="0.30"/>
<line x1="450" y1="285" x2="900" y2="500" stroke="#b09060" stroke-width="1.5" opacity="0.40"/>
<line x1="190" y1="328" x2="710" y2="328" stroke="#b09060" stroke-width="1" opacity="0.22"/>
<line x1="185" y1="375" x2="715" y2="375" stroke="#b09060" stroke-width="1" opacity="0.18"/>
<line x1="180" y1="430" x2="720" y2="430" stroke="#b09060" stroke-width="1" opacity="0.15"/>
<!-- window -->
<rect x="320" y="102" width="260" height="168" fill="url(#n3-sky)"/>
<rect x="320" y="102" width="260" height="168" fill="url(#n3-sun)"/>
<rect x="320" y="102" width="260" height="168" fill="none" stroke="#d4cfc8" stroke-width="8"/>
<line x1="450" y1="102" x2="450" y2="270" stroke="#d4cfc8" stroke-width="6"/>
<line x1="320" y1="186" x2="580" y2="186" stroke="#d4cfc8" stroke-width="6"/>
<!-- sunlight on floor -->
<polygon points="310,270 590,270 820,500 80,500" fill="#fff5d8" opacity="0.22"/>
<ellipse cx="450" cy="430" rx="230" ry="58" fill="#fff5d8" opacity="0.28"/>
<!-- skirting boards -->
<polygon points="180,282 720,282 720,290 180,290" fill="#ccc7c0" opacity="0.7"/>
<polygon points="0,497 180,285 180,290 0,500" fill="#c8c3bc" opacity="0.7"/>
<polygon points="900,497 720,285 720,290 900,500" fill="#c4bfb8" opacity="0.7"/>
<!-- floor sheen -->
<polygon points="180,285 720,285 720,500 180,500" fill="#fff" opacity="0.05"/>
<rect width="900" height="500" fill="#fff" opacity="0.06"/>
<rect width="900" height="500" fill="url(#n3-vig)"/>
<rect x="0" y="448" width="900" height="52" fill="#000" opacity="0.48"/>
<text x="22" y="483" font-family="Arial Black,Arial" font-weight="900" font-size="21" fill="#fff" letter-spacing="1">Nach der Entrümpelung – besenrein</text>
</svg>
