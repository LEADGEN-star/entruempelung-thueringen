<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="wallN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0eb"/>
      <stop offset="100%" stop-color="#ede8e0"/>
    </linearGradient>
    <linearGradient id="floorN" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4c8b4"/>
      <stop offset="100%" stop-color="#c8bc a8"/>
    </linearGradient>
    <linearGradient id="sunN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbe8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fffbe8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="900" height="480" fill="url(#wallN)"/>
  <!-- Floor -->
  <polygon points="0,330 900,290 900,480 0,480" fill="#cfc0a4"/>
  <!-- Floor planks -->
  <line x1="0" y1="370" x2="900" y2="358" stroke="#b8a88e" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="410" x2="900" y2="396" stroke="#b8a88e" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="450" x2="900" y2="434" stroke="#b8a88e" stroke-width="1.5" opacity="0.5"/>
  <line x1="150" y1="330" x2="140" y2="480" stroke="#b8a88e" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="310" x2="290" y2="480" stroke="#b8a88e" stroke-width="1" opacity="0.4"/>
  <line x1="450" y1="300" x2="440" y2="480" stroke="#b8a88e" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="293" x2="590" y2="480" stroke="#b8a88e" stroke-width="1" opacity="0.4"/>
  <line x1="750" y1="291" x2="740" y2="480" stroke="#b8a88e" stroke-width="1" opacity="0.4"/>

  <!-- Window with sunlight -->
  <rect x="580" y="50" width="200" height="170" rx="4" fill="#b8d8f0"/>
  <rect x="580" y="50" width="200" height="170" rx="4" fill="none" stroke="#8ab0c8" stroke-width="6"/>
  <line x1="680" y1="50" x2="680" y2="220" stroke="#8ab0c8" stroke-width="4"/>
  <line x1="580" y1="135" x2="780" y2="135" stroke="#8ab0c8" stroke-width="4"/>
  <!-- Sun glow through window -->
  <polygon points="580,50 780,50 900,0 900,200 780,220 580,220" fill="url(#sunN)"/>

  <!-- Baseboard left -->
  <rect x="0" y="310" width="580" height="14" rx="2" fill="#e0d8cc"/>
  <!-- Baseboard right -->
  <rect x="780" y="280" width="120" height="14" rx="2" fill="#e0d8cc"/>

  <!-- Empty room - just clean walls and floor -->
  <!-- Light switch -->
  <rect x="555" y="180" width="22" height="32" rx="3" fill="#e8e0d5" stroke="#d0c8bc" stroke-width="1.5"/>
  <rect x="560" y="187" width="12" height="18" rx="2" fill="#f0e8de"/>

  <!-- Single small item: a broom in corner (showing it's been cleaned) -->
  <line x1="110" y1="200" x2="95" y2="335" stroke="#8b6f50" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="92" cy="340" rx="18" ry="8" fill="#6b5030" transform="rotate(-8,92,340)"/>
  <!-- broom bristles -->
  <line x1="80" y1="336" x2="72" y2="352" stroke="#a08060" stroke-width="3" stroke-linecap="round"/>
  <line x1="86" y1="338" x2="80" y2="354" stroke="#a08060" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="340" x2="88" y2="356" stroke="#a08060" stroke-width="3" stroke-linecap="round"/>
  <line x1="98" y1="340" x2="97" y2="356" stroke="#a08060" stroke-width="3" stroke-linecap="round"/>
  <line x1="104" y1="338" x2="106" y2="354" stroke="#a08060" stroke-width="3" stroke-linecap="round"/>

  <!-- Big green checkmark in center -->
  <circle cx="450" cy="210" r="72" fill="#16a34a" opacity="0.12"/>
  <circle cx="450" cy="210" r="60" fill="none" stroke="#16a34a" stroke-width="4" opacity="0.3"/>
  <polyline points="418,210 440,232 484,186" fill="none" stroke="#16a34a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text label -->
  <text x="450" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#16a34a" opacity="0.8">Besenrein geräumt</text>

  <!-- Subtle shadow at floor edge -->
  <rect x="0" y="318" width="900" height="16" fill="#000" opacity="0.04"/>
</svg>
