<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" role="img" aria-label="Entrümpelung Thüringen Logo">
  <!-- Dark background for visibility -->
  <rect width="280" height="60" rx="6" fill="#111827"/>
  <!-- House icon with arrow pointing out (representing clearance) -->
  <g transform="translate(4, 6)">
    <!-- House body -->
    <rect x="4" y="22" width="30" height="22" rx="2" fill="#ea580c"/>
    <!-- Roof -->
    <polygon points="19,6 0,24 38,24" fill="#f97316"/>
    <!-- Door -->
    <rect x="12" y="30" width="8" height="14" rx="1" fill="#111827"/>
    <!-- Arrow pointing right (out of house) -->
    <line x1="28" y1="33" x2="46" y2="33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="40,27 47,33 40,39" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text: Entrümpelung -->
  <text x="64" y="26" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" fill="#ffffff" letter-spacing="-0.3">Entrümpelung</text>
  <!-- Text: Thüringen (orange) -->
  <text x="64" y="50" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" fill="#f97316" letter-spacing="-0.3">Thüringen</text>
</svg>
